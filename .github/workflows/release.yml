name: Package skill release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Publish skill package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$TAG" release/paper-reconstruction-0.1.0.zip --title "$TAG" --notes-file docs/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
